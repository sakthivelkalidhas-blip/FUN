<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Multiplayer Arena</title>
  <link rel="stylesheet" href="style.css" />
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="stats">
      <div>HP: <span id="hp">100</span></div>
      <div>GLOO: <span id="gloo-count">3</span></div>
      <div>MEDKITS: <span id="medkit-count">2</span></div>
      <div>SCORE: <span id="local-score">0</span> - <span id="remote-score">0</span></div>
    </div>
    
    <div id="heal-bar-container" class="hidden">
      <div id="heal-label">HEALING...</div>
      <div id="heal-bar"><div id="heal-progress"></div></div>
    </div>
  </div>

  <!-- Mobile Touch Controls -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-knob"></div>
    </div>
    <div id="touch-look-area"></div>
    
    <div id="action-buttons">
      <button id="btn-fire" class="action-btn">🔥</button>
      <button id="btn-jump" class="action-btn">⬆️</button>
      <button id="btn-gloo" class="action-btn">🛡️</button>
      <button id="btn-medkit" class="action-btn">💉</button>
    </div>
  </div>

  <!-- Intro Screen & Lobby -->
  <div id="intro-screen">
    <div id="lobby-card">
      <h2>MULTIPLAYER ARENA</h2>
      
      <div class="room-section">
        <label>YOUR 10-DIGIT ROOM ID</label>
        <div class="room-id-container">
          <span id="my-id">Generating...</span>
          <button id="copy-btn" title="Copy Room ID">Copy ID</button>
        </div>
      </div>

      <hr />

      <div class="room-section">
        <label>JOIN A GAME</label>
        <div class="join-container">
          <input 
            type="text" 
            id="join-id" 
            placeholder="Enter 10-Digit Room ID" 
            maxlength="10" 
            pattern="[0-9]*" 
            inputmode="numeric" 
          />
          <button id="join-btn">Join Room</button>
        </div>
      </div>

      <button id="start-btn">START MATCH</button>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="hidden">
      <h1 id="match-result-title">VICTORY!</h1>
      <p id="match-result-sub">CHAMPION</p>
      <button onclick="location.reload()">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
